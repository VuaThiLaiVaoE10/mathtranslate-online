[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mathtranslate"
version = "3.1.2"
description = "Translate math-heavy LaTeX papers while preserving math expressions"
requires-python = ">=3.9"
dependencies = [
    "mtranslate",
    "charset-normalizer",
    "requests",
    "regex",
    "tqdm",
    "appdata",
]

[project.optional-dependencies]
dev = ["pytest"]
web = ["flask>=3.0"]
pdf = ["pymupdf>=1.25"]

[project.scripts]
translate_tex = "mathtranslate.translate_tex:main"
translate_arxiv = "mathtranslate.translate_arxiv:main"
translate_pdf = "mathtranslate.pdf_doc:main"
mathtranslate-web = "web.app:run_server"
mathtranslate-gui = "gui.app:run_gui"

[tool.setuptools.packages.find]
where = ["."]
include = ["mathtranslate*", "web*", "gui*"]

[tool.setuptools.package-data]
mathtranslate = ["version.txt", "author.txt"]
